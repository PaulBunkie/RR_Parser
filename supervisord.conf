# Supervisor configuration for RR Fetcher + FlareSolverr in single container

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[program:flaresolverr]
command=python -m flaresolverr --port 8191
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/flaresolverr.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/flaresolverr_err.log
stderr_logfile_maxbytes=10MB
environment=PORT=8191

[program:rr-fetcher]
command=python -m uvicorn main:app --host 0.0.0.0 --port 5555 --workers 1 --timeout-keep-alive 300 --timeout-graceful-shutdown 60 --limit-concurrency 10
directory=/app
autostart=true
autorestart=true
startretries=3
stdout_logfile=/var/log/rr-fetcher.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/rr-fetcher_err.log
stderr_logfile_maxbytes=10MB
environment=FLARESOLVERR_URL=http://localhost:8191,PORT=5555

# Start flaresolverr first, then rr-fetcher
[group:rr-services]
programs=flaresolverr,rr-fetcher
priority=999