# Supervisor configuration for RR Fetcher + FlareSolverr (minimal resources)

[supervisord]
nodaemon=true
loglevel=warn
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/home/fetcher/data/supervisord.pid

[program:flaresolverr]
command=python -m flaresolverr --port 8191 --host 0.0.0.0
autostart=true
autorestart=true
startsecs=60
startretries=3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=10
environment=PORT=8191,
    CHROME_FLAGS="--no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --memory-pressure-off --max_old_space_size=1024 --disable-blink-features=AutomationControlled --disable-features=IsolateOrigins,site-per-process",
    TZ=Europe/Moscow,
    LANG=ru_RU.UTF-8

[program:rr-fetcher]
command=python -m uvicorn main:app --host 0.0.0.0 --port 5555 --workers 1 --timeout-keep-alive 300 --limit-concurrency 50 --limit-max-requests 1000
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=FLARESOLVERR_URL=http://localhost:8191,PORT=5555
priority=20